# Go-To-ChaoRai v10 Llama comparison model using the same grounded dataset.
model: "mlx-community/Llama-3.2-1B-Instruct-4bit"
train: true
fine_tune_type: lora
data: "data/mlx-quality-v10"
seed: 20260925
num_layers: 16
batch_size: 2
# 2 passes over the 2,384-record prepared training split (batch size 2).
iters: 2384
learning_rate: 1.0e-5
steps_per_report: 10
steps_per_eval: 200
val_batches: 5
adapter_path: "models/go-to-chaorai-llama-3.2-1b-quality-v10-lora"
save_every: 200
max_seq_length: 1024
grad_checkpoint: true
grad_accumulation_steps: 1
mask_prompt: true
lora_parameters:
  keys: ["self_attn.q_proj", "self_attn.v_proj"]
  rank: 16
  scale: 32
  dropout: 0.05
